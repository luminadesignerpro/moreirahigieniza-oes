<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamentos — Painel Moreira Higienizações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-styles.css">
</head>
<body>

<main class="main">
  <div class="topbar">
    <div>
      <h2>Agendamentos</h2>
      <p class="subtitle">Visitas e serviços, do agendamento até o pagamento.</p>
    </div>
    <button class="btn btn-primary" id="btnNovoAgendamento">+ Novo agendamento</button>
  </div>

  <div class="tabs" id="tabsStatus">
    <button class="tab active" data-status="todos">Todos</button>
    <button class="tab" data-status="agendado">Agendados</button>
    <button class="tab" data-status="andamento">Em andamento</button>
    <button class="tab" data-status="concluido">Concluídos</button>
    <button class="tab" data-status="cancelado">Cancelados</button>
  </div>

  <div class="card">
    <div id="tabelaAgendamentos">
      <div class="empty-state"><div class="empty-icon">🗓️</div><p>Carregando...</p></div>
    </div>
  </div>
</main>

<!-- MODAL NOVO/EDITAR AGENDAMENTO -->
<div class="modal-overlay" id="modalAgendamento">
  <div class="modal-box">
    <h3 id="modalTitulo">Novo agendamento</h3>
    <form id="formAgendamento">
      <input type="hidden" id="agendamentoId">

      <div class="field">
        <label>Nome do cliente</label>
        <input type="text" id="campoNomeCliente" required placeholder="Ex: Maria Silva">
      </div>
      <div class="field">
        <label>Telefone (WhatsApp)</label>
        <input type="text" id="campoTelefoneCliente" required placeholder="(85) 9 9999-9999">
      </div>
      <div class="field">
        <label>Endereço (pra rota do dia / mapa)</label>
        <input type="text" id="campoEndereco" placeholder="Rua, número, bairro">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Serviço</label>
          <select id="campoTipoServico" required>
            <option value="sofa">Sofá</option>
            <option value="colchao">Colchão</option>
            <option value="poltrona">Poltrona</option>
            <option value="tapete">Tapete</option>
          </select>
        </div>
        <div class="field">
          <label>Data do serviço</label>
          <input type="date" id="campoDataServico" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Horário</label>
          <div class="horario-selects">
            <select id="campoHora">
              <option value="">Hora</option>
            </select>
            <select id="campoMinuto">
              <option value="">Min</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Repete a cada quantos meses?</label>
          <select id="campoRecorrencia">
            <option value="">Não repete</option>
            <option value="1">Todo mês</option>
            <option value="2">A cada 2 meses</option>
            <option value="3">A cada 3 meses</option>
            <option value="6">A cada 6 meses</option>
            <option value="12">1 vez por ano</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Valor cobrado (R$)</label>
          <input type="number" id="campoValor" step="0.01" min="0" required placeholder="120.00">
        </div>
        <div class="field">
          <label>Custo do produto (R$)</label>
          <input type="number" id="campoCusto" step="0.01" min="0" value="0">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Forma de pagamento</label>
          <select id="campoFormaPagamento">
            <option value="pix">Pix</option>
            <option value="dinheiro">Dinheiro</option>
            <option value="cartao">Cartão</option>
          </select>
        </div>
        <div class="field">
          <label>Status do pagamento</label>
          <select id="campoStatusPagamento">
            <option value="pendente">Pendente</option>
            <option value="pago">Pago</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Observações</label>
        <textarea id="campoObservacoes" rows="2" placeholder="Detalhes do serviço, bairro, etc."></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="btnCancelarModal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL PIX -->
<div class="modal-overlay" id="modalPix">
  <div class="modal-box" style="max-width:340px; text-align:center;">
    <h3>Cobrar via Pix</h3>
    <p style="color:#66738a; font-size:0.85rem; margin-bottom:14px;" id="pixDescricao"></p>
    <div id="pixQrCode" style="display:flex; justify-content:center; margin-bottom:14px;"></div>
    <textarea id="pixCopiaECola" readonly rows="3" style="width:100%; font-family:'JetBrains Mono',monospace; font-size:0.7rem; padding:8px; border-radius:8px; border:1.5px solid #DDE3ED; resize:none;"></textarea>
    <button type="button" class="btn btn-primary" id="btnCopiarPix" style="width:100%; margin-top:10px;">Copiar código Pix</button>
    <button type="button" class="btn btn-outline" id="btnFecharPix" style="width:100%; margin-top:8px;">Fechar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../supabase-loader.js"></script>
<script src="../config.js"></script>
<script src="pix-utils.js"></script>
<script src="admin-data.js"></script>
<script src="admin-sidebar.js"></script>
<script>
  protegerPagina();
  montarSidebar("agendamentos");

  const ICONES_SERVICO = { sofa: "🛋️", colchao: "🛏️", poltrona: "🪑", tapete: "🧶" };
  const NOMES_SERVICO = { sofa: "Sofá", colchao: "Colchão", poltrona: "Poltrona", tapete: "Tapete" };

  // ----- HORÁRIO (hora/minuto, 24 opções escritas por extenso) -----
  const HORAS_EXTENSO = [
    "Meia-noite", "Uma hora", "Duas horas", "Três horas", "Quatro horas", "Cinco horas",
    "Seis horas", "Sete horas", "Oito horas", "Nove horas", "Dez horas", "Onze horas",
    "Meio-dia", "Treze horas", "Catorze horas", "Quinze horas", "Dezesseis horas",
    "Dezessete horas", "Dezoito horas", "Dezenove horas", "Vinte horas", "Vinte e uma horas",
    "Vinte e duas horas", "Vinte e três horas"
  ];
  const MINUTOS_DISPONIVEIS = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, "0"));

  function preencherSelectsHorario() {
    const selectHora = document.getElementById("campoHora");
    const selectMinuto = document.getElementById("campoMinuto");

    selectHora.innerHTML = '<option value="">Hora</option>' + HORAS_EXTENSO.map((nome, i) => {
      const valor = String(i).padStart(2, "0");
      return `<option value="${valor}">${valor}h — ${nome}</option>`;
    }).join("");

    selectMinuto.innerHTML = '<option value="">Min</option>' + MINUTOS_DISPONIVEIS.map((m) => `<option value="${m}">${m}</option>`).join("");
  }
  preencherSelectsHorario();

  function montarHorarioSelecionado() {
    const hora = document.getElementById("campoHora").value;
    const minuto = document.getElementById("campoMinuto").value;
    if (!hora) return null;
    return `${hora}:${minuto || "00"}`;
  }

  function preencherHorarioNosSelects(horarioSalvo) {
    const [hora, minuto] = (horarioSalvo || "").split(":");
    document.getElementById("campoHora").value = hora || "";
    document.getElementById("campoMinuto").value = minuto || "00";
  }

  let agendamentosCache = [];
  let filtroAtual = "todos";

  async function carregarAgendamentos() {
    const container = document.getElementById("tabelaAgendamentos");
    try {
      agendamentosCache = await listarAgendamentos({ limite: 300 });
      renderizarTabela();
    } catch (err) {
      console.error(err);
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Não foi possível carregar. Verifique a conexão com o Supabase.</p></div>`;
    }
  }

  function renderizarTabela() {
    const container = document.getElementById("tabelaAgendamentos");
    const lista = filtroAtual === "todos"
      ? agendamentosCache
      : agendamentosCache.filter((a) => a.status === filtroAtual);

    if (lista.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">🗓️</div><p>Nenhum agendamento aqui ainda.</p></div>`;
      return;
    }

    container.innerHTML = `
      <div class="table-scroll"><table>
        <thead>
          <tr>
            <th>Cliente</th><th>Serviço</th><th>Data</th><th>Valor</th><th>Pagamento</th><th>Status</th><th>Confirmação</th><th></th>
          </tr>
        </thead>
        <tbody>
          ${lista.map((a) => `
            <tr>
              <td>
                <strong>${a.clientes?.nome || "Cliente"}</strong><br>
                <span style="color:#8b97ab; font-size:0.78rem;">${a.clientes?.telefone || ""}</span>
              </td>
              <td>${ICONES_SERVICO[a.tipo_servico] || ""} ${NOMES_SERVICO[a.tipo_servico] || a.tipo_servico}</td>
              <td>${formatarData(a.data_servico)}</td>
              <td>${formatarMoeda(a.valor_cobrado)}</td>
              <td><span class="badge badge-${a.status_pagamento === 'pago' ? 'pago' : 'pendente'}">${a.status_pagamento}</span></td>
              <td>
                <select class="select-status" data-id="${a.id}" style="border:1.5px solid #DDE3ED; border-radius:8px; padding:6px 10px; font-size:0.8rem; background:var(--creme-claro);">
                  <option value="agendado" ${a.status === 'agendado' ? 'selected' : ''}>Agendado</option>
                  <option value="andamento" ${a.status === 'andamento' ? 'selected' : ''}>Em andamento</option>
                  <option value="concluido" ${a.status === 'concluido' ? 'selected' : ''}>Concluído</option>
                  <option value="cancelado" ${a.status === 'cancelado' ? 'selected' : ''}>Cancelado</option>
                </select>
              </td>
              <td>
                ${a.confirmado === 'confirmado' ? '<span class="badge badge-pago">✓ Confirmado</span>' : ''}
                ${a.confirmado === 'remarcar' ? '<span class="badge" style="background:#F6DDD5; color:#C8553D;">↻ Remarcar</span>' : ''}
                ${(!a.confirmado || a.confirmado === 'pendente') ? '<span class="badge badge-pendente">A confirmar</span>' : ''}
              </td>
              <td>
                <button class="btn-icon btn-editar" data-id="${a.id}" title="Editar">✏️</button>
                <button class="btn-icon btn-pix" data-id="${a.id}" title="Gerar Pix">📱</button>
                <button class="btn-icon btn-recibo" data-id="${a.id}" title="Gerar recibo PDF">📄</button>
                ${a.status === 'concluido' ? `<button class="btn-icon btn-avaliacao" data-id="${a.id}" title="Pedir avaliação">⭐</button>` : ""}
                <button class="btn-icon danger btn-excluir" data-id="${a.id}" title="Excluir">🗑️</button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table></div>`;

    document.querySelectorAll(".select-status").forEach((select) => {
      select.addEventListener("change", async (e) => {
        const id = e.target.dataset.id;
        try {
          await atualizarAgendamento(id, { status: e.target.value });
          mostrarToast("Status atualizado.", "success");
          await carregarAgendamentos();
        } catch (err) {
          mostrarToast("Erro ao atualizar status.", "error");
        }
      });
    });

    document.querySelectorAll(".btn-editar").forEach((btn) => {
      btn.addEventListener("click", () => abrirModalEdicao(btn.dataset.id));
    });

    document.querySelectorAll(".btn-pix").forEach((btn) => {
      btn.addEventListener("click", () => abrirModalPix(btn.dataset.id));
    });

    document.querySelectorAll(".btn-recibo").forEach((btn) => {
      btn.addEventListener("click", () => gerarReciboPDF(btn.dataset.id));
    });

    document.querySelectorAll(".btn-avaliacao").forEach((btn) => {
      btn.addEventListener("click", () => pedirAvaliacao(btn.dataset.id));
    });

    document.querySelectorAll(".btn-excluir").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Excluir este agendamento? Essa ação não pode ser desfeita.")) return;
        try {
          await excluirAgendamento(btn.dataset.id);
          mostrarToast("Agendamento excluído.", "success");
          await carregarAgendamentos();
        } catch (err) {
          mostrarToast("Erro ao excluir.", "error");
        }
      });
    });
  }

  document.querySelectorAll("#tabsStatus .tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll("#tabsStatus .tab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      filtroAtual = tab.dataset.status;
      renderizarTabela();
    });
  });

  // ----- MODAL -----
  const modal = document.getElementById("modalAgendamento");
  const form = document.getElementById("formAgendamento");

  document.getElementById("btnNovoAgendamento").addEventListener("click", () => {
    document.getElementById("modalTitulo").textContent = "Novo agendamento";
    form.reset();
    document.getElementById("agendamentoId").value = "";
    document.getElementById("campoDataServico").value = new Date().toISOString().slice(0, 10);
    document.getElementById("campoHora").value = "";
    document.getElementById("campoMinuto").value = "00";
    modal.classList.add("open");
  });

  document.getElementById("btnCancelarModal").addEventListener("click", () => modal.classList.remove("open"));
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("open"); });

  function abrirModalEdicao(id) {
    const ag = agendamentosCache.find((a) => String(a.id) === String(id));
    if (!ag) return;

    document.getElementById("modalTitulo").textContent = "Editar agendamento";
    document.getElementById("agendamentoId").value = ag.id;
    document.getElementById("campoNomeCliente").value = ag.clientes?.nome || "";
    document.getElementById("campoTelefoneCliente").value = ag.clientes?.telefone || "";
    document.getElementById("campoEndereco").value = ag.clientes?.endereco || "";
    document.getElementById("campoTipoServico").value = ag.tipo_servico;
    document.getElementById("campoDataServico").value = (ag.data_servico || "").slice(0, 10);
    preencherHorarioNosSelects((ag.horario || "").slice(0, 5));
    document.getElementById("campoRecorrencia").value = ag.recorrencia_meses || "";
    document.getElementById("campoValor").value = ag.valor_cobrado;
    document.getElementById("campoCusto").value = ag.custo_produto || 0;
    document.getElementById("campoFormaPagamento").value = ag.forma_pagamento || "pix";
    document.getElementById("campoStatusPagamento").value = ag.status_pagamento || "pendente";
    document.getElementById("campoObservacoes").value = ag.observacoes || "";
    modal.classList.add("open");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("agendamentoId").value;

    try {
      const cliente = await buscarOuCriarCliente({
        nome: document.getElementById("campoNomeCliente").value.trim(),
        telefone: document.getElementById("campoTelefoneCliente").value.trim(),
        bairro: null,
        endereco: document.getElementById("campoEndereco").value.trim()
      });

      const payload = {
        cliente_id: cliente.id,
        tipo_servico: document.getElementById("campoTipoServico").value,
        data_servico: document.getElementById("campoDataServico").value,
        horario: montarHorarioSelecionado(),
        recorrencia_meses: document.getElementById("campoRecorrencia").value
          ? parseInt(document.getElementById("campoRecorrencia").value) : null,
        valor_cobrado: parseFloat(document.getElementById("campoValor").value) || 0,
        custo_produto: parseFloat(document.getElementById("campoCusto").value) || 0,
        forma_pagamento: document.getElementById("campoFormaPagamento").value,
        status_pagamento: document.getElementById("campoStatusPagamento").value,
        observacoes: document.getElementById("campoObservacoes").value.trim()
      };

      if (id) {
        await atualizarAgendamento(id, payload);
        mostrarToast("Agendamento atualizado.", "success");
      } else {
        payload.status = STATUS_AGENDAMENTO.AGENDADO;
        await criarAgendamento(payload);
        mostrarToast("Agendamento criado.", "success");
      }

      modal.classList.remove("open");
      await carregarAgendamentos();
    } catch (err) {
      console.error(err);
      mostrarToast("Erro ao salvar agendamento.", "error");
    }
  });

  carregarAgendamentos();

  // ----- PIX -----
  const modalPix = document.getElementById("modalPix");
  document.getElementById("btnFecharPix").addEventListener("click", () => modalPix.classList.remove("open"));
  modalPix.addEventListener("click", (e) => { if (e.target === modalPix) modalPix.classList.remove("open"); });

  function abrirModalPix(id) {
    const ag = agendamentosCache.find((a) => String(a.id) === String(id));
    if (!ag) return;

    if (!CONFIG.pixChave || CONFIG.pixChave === "SUA-CHAVE-PIX-AQUI") {
      mostrarToast("Configure sua chave Pix real em config.js antes de usar.", "error");
      return;
    }

    const codigo = gerarPixCopiaECola({
      chave: CONFIG.pixChave,
      nomeRecebedor: CONFIG.pixNomeRecebedor,
      cidade: CONFIG.pixCidade,
      valor: ag.valor_cobrado,
      identificador: ag.id.replace(/-/g, "").slice(0, 25)
    });

    document.getElementById("pixDescricao").textContent =
      `${ag.clientes?.nome || "Cliente"} — ${formatarMoeda(ag.valor_cobrado)}`;
    document.getElementById("pixCopiaECola").value = codigo;

    const qrContainer = document.getElementById("pixQrCode");
    qrContainer.innerHTML = "";
    new QRCode(qrContainer, { text: codigo, width: 200, height: 200 });

    modalPix.classList.add("open");
  }

  document.getElementById("btnCopiarPix").addEventListener("click", () => {
    const campo = document.getElementById("pixCopiaECola");
    campo.select();
    navigator.clipboard.writeText(campo.value).then(() => {
      mostrarToast("Código Pix copiado!", "success");
    }).catch(() => {
      document.execCommand("copy");
      mostrarToast("Código Pix copiado!", "success");
    });
  });

  // ----- RECIBO PDF -----

  function gerarReciboPDF(id) {
    const ag = agendamentosCache.find((a) => String(a.id) === String(id));
    if (!ag) return;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.addImage(LOGO_RECIBO_BASE64, "PNG", 18, 10, 22, 22);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.text("Moreira Higienizações", 44, 20);
    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text("Higienização profissional de estofados", 44, 27);
    doc.line(20, 34, 190, 34);

    doc.setFontSize(13);
    doc.setFont("helvetica", "bold");
    doc.text("Recibo de Serviço", 20, 45);

    doc.setFontSize(11);
    doc.setFont("helvetica", "normal");
    const linhas = [
      ["Cliente:", ag.clientes?.nome || "—"],
      ["Telefone:", ag.clientes?.telefone || "—"],
      ["Serviço:", NOMES_SERVICO[ag.tipo_servico] || ag.tipo_servico],
      ["Data:", formatarData(ag.data_servico)],
      ["Valor:", formatarMoeda(ag.valor_cobrado)],
      ["Forma de pagamento:", ag.forma_pagamento || "—"],
      ["Status do pagamento:", ag.status_pagamento === "pago" ? "Pago" : "Pendente"]
    ];

    let y = 58;
    linhas.forEach(([label, valor]) => {
      doc.setFont("helvetica", "bold");
      doc.text(label, 20, y);
      doc.setFont("helvetica", "normal");
      doc.text(String(valor), 75, y);
      y += 9;
    });

    y += 10;
    doc.line(20, y, 190, y);
    y += 10;
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text("Este documento serve como comprovante do serviço prestado.", 20, y);
    doc.text(`Emitido em ${new Date().toLocaleDateString("pt-BR")}`, 20, y + 6);

    doc.save(`recibo-${(ag.clientes?.nome || "cliente").replace(/\s+/g, "-").toLowerCase()}-${ag.data_servico}.pdf`);
  }

  // ----- PEDIR AVALIAÇÃO -----
  async function pedirAvaliacao(id) {
    const ag = agendamentosCache.find((a) => String(a.id) === String(id));
    if (!ag || !ag.clientes?.telefone) {
      mostrarToast("Cliente sem telefone cadastrado.", "error");
      return;
    }

    const link = `${window.location.origin}/avaliar.html?agendamento=${ag.id}`;
    const mensagem = `Olá, ${ag.clientes.nome}! Tudo bem? Ficamos felizes em higienizar seu ${NOMES_SERVICO[ag.tipo_servico].toLowerCase()}. Poderia deixar uma avaliação rápida? ${link}`;
    const numero = ag.clientes.telefone.replace(/\D/g, "");

    window.open(`https://wa.me/55${numero}?text=${encodeURIComponent(mensagem)}`, "_blank");

    try {
      await atualizarAgendamento(id, { avaliacao_pedida_em: new Date().toISOString() });
    } catch (err) {
      console.error("Não foi possível marcar avaliação como pedida:", err);
    }
  }
</script>
