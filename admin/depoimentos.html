<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depoimentos — Painel Moreira Higienizações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-styles.css">
<style>
  .depo-card { background: var(--branco); border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(11,37,69,0.06); }
  .depo-topo { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .depo-nome { font-weight: 700; color: var(--azul-marinho); }
  .depo-bairro { font-size: 0.78rem; color: #8b97ab; }
  .depo-estrelas { color: var(--dourado); letter-spacing: 2px; }
  .depo-texto { color: #444; font-size: 0.92rem; line-height: 1.5; margin: 8px 0 14px; }
  .depo-acoes { display: flex; gap: 8px; }
  .tabs-depo { display: flex; gap: 8px; margin-bottom: 18px; }
  .tabs-depo button { padding: 8px 16px; border-radius: 100px; border: 1.5px solid var(--border-color, #DDE3ED); background: var(--branco); font-weight: 600; font-size: 0.85rem; color: var(--azul-marinho); }
  .tabs-depo button.active { background: var(--azul-marinho); color: white; border-color: var(--azul-marinho); }
</style>
</head>
<body>

<main class="main">
  <div class="topbar">
    <div>
      <h2>Depoimentos</h2>
      <p class="subtitle">Avaliações enviadas por clientes. Aprove as que quiser mostrar no site.</p>
    </div>
  </div>

  <div class="tabs-depo" id="tabsDepo">
    <button class="active" data-filtro="pendentes">Pendentes</button>
    <button data-filtro="aprovados">Aprovados</button>
    <button data-filtro="todos">Todos</button>
  </div>

  <div id="listaDepoimentos">
    <div class="empty-state"><div class="empty-icon">⭐</div><p>Carregando...</p></div>
  </div>
</main>

<script src="../supabase-loader.js"></script>
<script src="../config.js"></script>
<script src="admin-data.js"></script>
<script src="admin-sidebar.js"></script>
<script>
  protegerPagina();
  montarSidebar("depoimentos");

  let depoimentosCache = [];
  let filtroAtual = "pendentes";

  async function carregarDepoimentos() {
    const container = document.getElementById("listaDepoimentos");
    try {
      depoimentosCache = await listarDepoimentos({ apenasAprovados: false });
      renderizar();
    } catch (err) {
      console.error(err);
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Não foi possível carregar. Verifique a conexão com o Supabase.</p></div>`;
    }
  }

  function renderizar() {
    const container = document.getElementById("listaDepoimentos");
    let lista = depoimentosCache;
    if (filtroAtual === "pendentes") lista = lista.filter((d) => !d.aprovado);
    if (filtroAtual === "aprovados") lista = lista.filter((d) => d.aprovado);

    if (lista.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">⭐</div><p>Nenhum depoimento aqui ainda.</p></div>`;
      return;
    }

    container.innerHTML = lista.map((d) => `
      <div class="depo-card">
        <div class="depo-topo">
          <div>
            <div class="depo-nome">${d.nome_cliente}</div>
            ${d.bairro ? `<div class="depo-bairro">${d.bairro}</div>` : ""}
          </div>
          <div class="depo-estrelas">${"★".repeat(d.nota)}${"☆".repeat(5 - d.nota)}</div>
        </div>
        <p class="depo-texto">"${d.texto}"</p>
        <div class="depo-acoes">
          ${!d.aprovado
            ? `<button class="btn btn-primary btn-sm btn-aprovar" data-id="${d.id}">✓ Aprovar e mostrar no site</button>`
            : `<button class="btn btn-outline btn-sm btn-reprovar" data-id="${d.id}">Ocultar do site</button>`
          }
          <button class="btn-icon danger btn-excluir-depo" data-id="${d.id}" title="Excluir">🗑️</button>
        </div>
      </div>
    `).join("");

    document.querySelectorAll(".btn-aprovar").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try {
          await aprovarDepoimento(btn.dataset.id, true);
          mostrarToast("Depoimento aprovado! Já aparece no site.", "success");
          await carregarDepoimentos();
        } catch (err) { mostrarToast("Erro ao aprovar.", "error"); }
      });
    });

    document.querySelectorAll(".btn-reprovar").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try {
          await aprovarDepoimento(btn.dataset.id, false);
          mostrarToast("Depoimento ocultado do site.", "success");
          await carregarDepoimentos();
        } catch (err) { mostrarToast("Erro ao ocultar.", "error"); }
      });
    });

    document.querySelectorAll(".btn-excluir-depo").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Excluir este depoimento definitivamente?")) return;
        try {
          await excluirDepoimento(btn.dataset.id);
          mostrarToast("Depoimento excluído.", "success");
          await carregarDepoimentos();
        } catch (err) { mostrarToast("Erro ao excluir.", "error"); }
      });
    });
  }

  document.querySelectorAll("#tabsDepo button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#tabsDepo button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      filtroAtual = btn.dataset.filtro;
      renderizar();
    });
  });

  carregarDepoimentos();
</script>
</body>
</html>
