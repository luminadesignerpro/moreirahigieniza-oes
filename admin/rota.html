<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota do dia — Painel Moreira Higienizações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-styles.css">
<style>
  .rota-data-seletor {
    display: flex; align-items: center; gap: 12px;
    background: var(--branco); padding: 10px 16px; border-radius: 100px;
    box-shadow: 0 2px 10px rgba(11,37,69,0.06); width: fit-content; margin-bottom: 22px;
  }
  .rota-data-seletor input[type="date"] { border: none; font-family: inherit; font-weight: 600; color: var(--azul-marinho); background: transparent; }
  .rota-item {
    display: flex; gap: 16px; padding: 18px; border-radius: 14px;
    background: var(--branco); box-shadow: 0 2px 10px rgba(11,37,69,0.06);
    margin-bottom: 14px; align-items: flex-start;
  }
  .rota-hora { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--azul-marinho); font-size: 1.05rem; min-width: 62px; }
  .rota-info { flex: 1; }
  .rota-info .cliente { font-weight: 700; color: var(--azul-marinho); margin-bottom: 2px; }
  .rota-info .endereco { color: #66738a; font-size: 0.88rem; margin-bottom: 8px; }
  .rota-info .servico { font-size: 0.84rem; color: var(--azul-marinho); }
  .rota-acoes { display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body>

<main class="main">
  <div class="topbar">
    <div>
      <h2>Rota do dia</h2>
      <p class="subtitle">Serviços do dia, em ordem, com atalho direto pro mapa.</p>
    </div>
  </div>

  <div class="rota-data-seletor">
    <button id="btnDiaAnterior" class="btn-icon">‹</button>
    <input type="date" id="campoDataRota">
    <button id="btnDiaProximo" class="btn-icon">›</button>
  </div>

  <div id="listaRota">
    <div class="empty-state"><div class="empty-icon">🗺️</div><p>Carregando...</p></div>
  </div>
</main>

<script src="../supabase-loader.js"></script>
<script src="../config.js"></script>
<script src="admin-data.js"></script>
<script src="admin-sidebar.js"></script>
<script>
  protegerPagina();
  montarSidebar("rota");

  const ICONES_SERVICO = { sofa: "🛋️", colchao: "🛏️", poltrona: "🪑", tapete: "🧶" };
  const NOMES_SERVICO = { sofa: "Sofá", colchao: "Colchão", poltrona: "Poltrona", tapete: "Tapete" };

  const campoData = document.getElementById("campoDataRota");
  campoData.value = new Date().toISOString().slice(0, 10);

  function linkMaps(endereco, bairro) {
    const destino = encodeURIComponent([endereco, bairro, "Fortaleza, CE"].filter(Boolean).join(", "));
    return `https://www.google.com/maps/search/?api=1&query=${destino}`;
  }

  async function carregarRota() {
    const container = document.getElementById("listaRota");
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🗺️</div><p>Carregando...</p></div>`;
    try {
      const lista = await listarAgendamentosPorData(campoData.value);
      const ativos = lista.filter((a) => a.status !== "cancelado");

      if (ativos.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">🗺️</div><p>Nenhum serviço agendado para este dia.</p></div>`;
        return;
      }

      // Ordena pelo horário real do agendamento (campo "horario"), sem horário vai por último
      const comHorario = ativos
        .map((a) => ({ ...a, _horario: a.horario ? a.horario.slice(0, 5) : null }))
        .sort((a, b) => (a._horario || "99:99").localeCompare(b._horario || "99:99"));

      container.innerHTML = comHorario.map((a) => {
        const cliente = a.clientes || {};
        const endereco = cliente.endereco || cliente.bairro || "";
        return `
          <div class="rota-item">
            <div class="rota-hora">${a._horario || "—"}</div>
            <div class="rota-info">
              <div class="cliente">${cliente.nome || "Cliente"}</div>
              <div class="endereco">${endereco || "Endereço não informado"}${cliente.telefone ? " · " + cliente.telefone : ""}</div>
              <div class="servico">${ICONES_SERVICO[a.tipo_servico] || ""} ${NOMES_SERVICO[a.tipo_servico] || a.tipo_servico} — <span class="badge badge-${a.status === 'concluido' ? 'pago' : 'pendente'}">${a.status}</span></div>
            </div>
            <div class="rota-acoes">
              ${endereco ? `<a href="${linkMaps(cliente.endereco, cliente.bairro)}" target="_blank" rel="noopener" class="btn btn-outline" style="font-size:0.78rem; padding:8px 12px;">📍 Mapa</a>` : ""}
              ${cliente.telefone ? `<a href="https://wa.me/55${cliente.telefone.replace(/\D/g,'')}" target="_blank" rel="noopener" class="btn btn-outline" style="font-size:0.78rem; padding:8px 12px;">💬 Whats</a>` : ""}
            </div>
          </div>`;
      }).join("");
    } catch (err) {
      console.error(err);
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Não foi possível carregar. Verifique a conexão com o Supabase.</p></div>`;
    }
  }

  document.getElementById("btnDiaAnterior").addEventListener("click", () => {
    const d = new Date(campoData.value + "T12:00:00");
    d.setDate(d.getDate() - 1);
    campoData.value = d.toISOString().slice(0, 10);
    carregarRota();
  });
  document.getElementById("btnDiaProximo").addEventListener("click", () => {
    const d = new Date(campoData.value + "T12:00:00");
    d.setDate(d.getDate() + 1);
    campoData.value = d.toISOString().slice(0, 10);
    carregarRota();
  });
  campoData.addEventListener("change", carregarRota);

  carregarRota();
</script>
</body>
</html>
